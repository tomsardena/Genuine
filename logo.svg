<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)" rx="16"/>

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">System Architecture Overview</text>

  <!-- Connector Lines -->
  <path d="M 250 200 L 400 200 M 400 200 L 550 200 M 400 250 L 400 380" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Node 1: Input -->
  <g transform="translate(150, 150)" filter="url(#shadow)">
    <rect width="200" height="100" rx="12" fill="url(#node-grad)"/>
    <text x="100" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Client / Input</text>
  </g>

  <!-- Node 2: Core Engine -->
  <g transform="translate(450, 150)" filter="url(#shadow)">
    <rect width="200" height="100" rx="12" fill="url(#node-grad)"/>
    <text x="100" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Processing Engine</text>
  </g>

  <!-- Node 3: Database / Storage -->
  <g transform="translate(300, 380)" filter="url(#shadow)">
    <rect width="200" height="100" rx="12" fill="url(#accent-grad)"/>
    <text x="100" y="55" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Data Storage</text>
  </g>
</svg>
