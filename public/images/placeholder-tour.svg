<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="400" cy="210" r="220" fill="url(#sunGlow)" />

  <!-- Subtle Hieroglyphic / Geometric Border Frame -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#78350f" stroke-opacity="0.25" stroke-width="1" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#d97706" stroke-opacity="0.2" stroke-width="1" />

  <!-- Winged Sun / Pharaonic Emblem Minimalist Vector -->
  <g transform="translate(400, 195) scale(0.95)">
    <!-- Sun Disc -->
    <circle cx="0" cy="0" r="32" fill="url(#gold)" />
    <!-- Inner Aura -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fef3c7" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Left Wing Flares -->
    <path d="M -38 -6 C -80 -18, -130 -16, -170 8 C -140 18, -90 12, -38 6 Z" fill="url(#gold)" opacity="0.85" />
    <path d="M -38 8 C -85 24, -135 24, -160 32 C -130 36, -85 26, -38 16 Z" fill="url(#gold)" opacity="0.65" />

    <!-- Right Wing Flares -->
    <path d="M 38 -6 C 80 -18, 130 -16, 170 8 C 140 18, 90 12, 38 6 Z" fill="url(#gold)" opacity="0.85" />
    <path d="M 38 8 C 85 24, 135 24, 160 32 C 130 36, 85 26, 38 16 Z" fill="url(#gold)" opacity="0.65" />
  </g>

  <!-- Brand Typography -->
  <text x="400" y="295" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="24" font-weight="600" fill="#fef3c7" text-anchor="middle" letter-spacing="4">
    GENUINE EGYPTE
  </text>
  <text x="400" y="325" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a8a29e" text-anchor="middle" letter-spacing="2">
    PRIVATE TOURS · NILE CRUISES · TRANSFERS
  </text>

  <!-- Subtle Status Note -->
  <text x="400" y="440" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#78716c" text-anchor="middle" letter-spacing="0.5">
    Authentic Experience Visual
  </text>
</svg>
